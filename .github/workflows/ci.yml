name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: build
        run: go build ./...
      - name: vet
        run: go vet ./...
      # Engine tests skip without OIDIO_TEST_MODELS (no sherpa models in CI);
      # the pure unit tests run under the race detector.
      - name: test
        run: go test -race ./...
